<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oh My Gosh Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFE44D;
    --ink: #2B0B3F;
    --pop: #E6007E;
    --sky: #7FD6FF;
    --paper: #FFFFFF;
    --shadow: #2B0B3F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2B0B3F; --ink: #FFE44D; --pop: #FF4FB0; --sky: #4FB8E8; --paper: #3E1759; --shadow: #000000;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2B0B3F; --ink: #FFE44D; --pop: #FF4FB0; --sky: #4FB8E8; --paper: #3E1759; --shadow: #000000;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg);
    background-image: radial-gradient(var(--pop) 1.5px, transparent 1.6px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow-x: hidden;
    text-align: center;
  }

  /* phone: one column. laptop: nickname + level | face | history */
  .page {
    max-width: 1240px; margin: 0 auto; padding: 1rem 1.25rem 3rem;
    display: grid; gap: 1.5rem;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "who" "center" "stats" "history";
  }
  .who { grid-area: who; }
  main { grid-area: center; position: relative; }
  .stats { grid-area: stats; }
  .history { grid-area: history; }

  .panel {
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 1rem 1.2rem; text-align: left;
  }
  .panel h2 {
    font-family: "Shrikhand", "Cooper Black", Georgia, serif; font-weight: 400;
    font-size: 1.4rem; margin: 0 0 .5rem; color: var(--pop);
  }

  h1 {
    font-family: "Shrikhand", "Cooper Black", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 4.6rem);
    line-height: .95;
    margin: .5rem 0 .25rem;
    color: var(--pop);
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 5px 5px 0 var(--ink);
    transform: rotate(-3deg);
  }

  .stage { position: relative; display: grid; place-items: center; margin: 2rem 0 1.5rem; }

  .bubble {
    position: absolute; top: -1.4rem; right: 4%;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px;
    padding: .5rem .9rem; font-weight: 800; font-size: 1.05rem;
    box-shadow: 4px 4px 0 var(--shadow);
    transform: rotate(6deg);
    max-width: 55%;
    z-index: 2;
  }
  .bubble::after {
    content: ""; position: absolute; left: 18px; bottom: -14px;
    border: 7px solid transparent; border-top-color: var(--ink);
    border-left-color: var(--ink);
  }

  .gasp {
    width: min(68vw, 280px, 40vh); aspect-ratio: 1;
    border-radius: 50%;
    border: 5px solid var(--ink);
    background: var(--sky);
    box-shadow: 0 12px 0 var(--shadow);
    cursor: pointer;
    padding: 0;
    transition: transform .08s ease, box-shadow .08s ease;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .gasp:hover { transform: translateY(-2px) rotate(-2deg); box-shadow: 0 14px 0 var(--shadow); }
  .gasp:active, .gasp.pressed { transform: translateY(10px); box-shadow: 0 2px 0 var(--shadow); }
  .gasp:focus-visible { outline: 5px dashed var(--pop); outline-offset: 8px; }
  .gasp:disabled { cursor: progress; opacity: .6; }
  .gasp svg { width: 100%; height: 100%; display: block; }
  .face-ink { fill: var(--ink); }
  #mouth { transition: ry .12s ease, rx .12s ease; }

  .count {
    font-family: "Shrikhand", "Cooper Black", Georgia, serif;
    font-size: clamp(3.5rem, 18vw, 6.5rem);
    line-height: 1; margin: 1.6rem 0 .2rem;
    font-variant-numeric: tabular-nums;
  }
  .count.bump { animation: bump .25s ease; }
  @keyframes bump { 50% { transform: scale(1.18) rotate(2deg); color: var(--pop); } }
  .count-label { font-weight: 600; margin: 0; }

  .rank {
    display: inline-block;
    background: var(--ink); color: var(--bg);
    padding: .55rem 1.1rem; border-radius: 999px;
    font-weight: 800; font-size: 1.1rem;
  }
  .next { font-size: .95rem; margin: .7rem 0 0; opacity: .85; }

  .small {
    font: 600 .95rem "Rubik", system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 12px;
    padding: .5rem 1rem; cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .small:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .small:focus-visible { outline: 3px dashed var(--pop); outline-offset: 3px; }
  .small.danger { background: var(--pop); color: #fff; }
  .stats .small { margin-top: 1.2rem; }

  .link {
    font: 600 .8rem "Rubik", system-ui, sans-serif;
    background: none; border: 0; color: var(--ink); opacity: .75;
    text-decoration: underline; cursor: pointer; padding: .15rem .25rem;
  }
  .link:hover { opacity: 1; }
  .link:focus-visible { outline: 2px dashed var(--pop); outline-offset: 2px; }
  .link:disabled { visibility: hidden; }
  .undo { display: block; font-size: .85rem; padding: .3rem .6rem; margin: .2rem auto 0; visibility: hidden; }
  .undo.show { visibility: visible; }

  .who { display: flex; gap: .5rem; align-items: center; justify-content: flex-end; font-size: .85rem; font-weight: 600; }
  .who input, dialog input {
    font: 600 .9rem "Rubik", system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 10px;
    padding: .35rem .6rem; width: 9rem; max-width: 50vw;
    box-shadow: 2px 2px 0 var(--shadow);
  }
  .who input:focus-visible, dialog input:focus-visible { outline: 3px dashed var(--pop); outline-offset: 3px; }

  .last { font-size: .95rem; margin: 0 0 .8rem; line-height: 1.45; min-height: 1.4em; }
  .last strong { font-weight: 800; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .3rem; align-items: center;
    padding: .45rem 0; border-top: 2px dotted color-mix(in srgb, var(--ink) 35%, transparent);
  }
  .log .name { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log time { display: block; font-size: .8rem; opacity: .8; font-variant-numeric: tabular-nums; }
  .more { font-size: .8rem; opacity: .7; margin: .6rem 0 0; }

  dialog {
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 6px 6px 0 var(--shadow);
    padding: 1.2rem 1.4rem; width: min(92vw, 380px); text-align: left;
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog p { margin: 0 0 1rem; line-height: 1.45; }
  dialog label { display: grid; gap: .35rem; font-weight: 600; margin-bottom: 1.1rem; }
  dialog label[hidden] { display: none; }
  dialog input { width: 100%; max-width: none; font-size: 1rem; }
  .dlg-btns { display: flex; flex-direction: row-reverse; gap: .6rem; }

  .status { font-size: .9rem; margin: .8rem auto 0; max-width: 40ch; line-height: 1.45; opacity: .85; min-height: 1.3em; }

  .floater {
    position: fixed; pointer-events: none; z-index: 10;
    font-family: "Shrikhand", "Cooper Black", Georgia, serif;
    color: var(--pop); -webkit-text-stroke: 1px var(--ink);
    white-space: nowrap;
    animation: floatUp 1.3s ease-out forwards;
  }
  .floater.other { font-size: 1rem !important; color: var(--sky); animation-duration: 1.8s; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.6) rotate(var(--r)); }
    15% { opacity: 1; transform: translate(-50%, -20px) scale(1.1) rotate(var(--r)); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -160px) scale(1) rotate(var(--r)); }
  }
  body.shake main { animation: shake .35s; }
  @keyframes shake {
    20% { transform: translate(-6px, 2px) rotate(-1deg); }
    40% { transform: translate(6px, -2px) rotate(1deg); }
    60% { transform: translate(-4px, 1px); }
    80% { transform: translate(3px, -1px); }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .floater, .count.bump, body.shake main { animation: none !important; }
    .floater { display: none; }
  }

  /* layout overrides last, so they win over the base rules above */
  @media (max-width: 999.98px) {
    .page { gap: 1rem; }
    .who.panel, .stats.panel { background: none; border: 0; box-shadow: none; padding: 0; text-align: center; }
  }
  @media (min-width: 1000px) {
    .page {
      grid-template-columns: minmax(0, 1fr) minmax(0, 560px) minmax(0, 1fr);
      grid-template-areas: "who center history" "stats center history";
      grid-template-rows: auto 1fr;
      align-items: start; gap: 1.5rem 2.5rem; padding-top: 1.5rem;
    }
    .who { flex-direction: column; align-items: stretch; }
    .who input { width: 100%; max-width: none; }
    .log { max-height: calc(100vh - 13rem); overflow-y: auto; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="who panel">
    <label for="nick">Nickname</label>
    <input id="nick" type="text" maxlength="24" autocomplete="nickname" placeholder="Someone">
  </div>

  <main>
    <h1>Oh My Gosh!</h1>

    <div class="stage">
      <div class="bubble" id="bubble" aria-hidden="true">press me, I dare you</div>
      <button class="gasp" id="gasp" aria-label="Say oh my gosh">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <!-- eyebrows -->
          <path id="browL" class="face-ink" d="M52 62 q18 -14 36 -4 l-2 7 q-15 -8 -32 4 z"/>
          <path id="browR" class="face-ink" d="M148 62 q-18 -14 -36 -4 l2 7 q15 -8 32 4 z"/>
          <!-- eyes -->
          <ellipse cx="70" cy="85" rx="15" ry="18" fill="#fff" stroke="currentColor" stroke-width="0"/>
          <ellipse cx="130" cy="85" rx="15" ry="18" fill="#fff"/>
          <circle id="pupilL" class="face-ink" cx="70" cy="88" r="7"/>
          <circle id="pupilR" class="face-ink" cx="130" cy="88" r="7"/>
          <!-- cheeks -->
          <ellipse cx="45" cy="120" rx="12" ry="7" fill="#E6007E" opacity=".45"/>
          <ellipse cx="155" cy="120" rx="12" ry="7" fill="#E6007E" opacity=".45"/>
          <!-- mouth -->
          <ellipse id="mouth" class="face-ink" cx="100" cy="140" rx="14" ry="16"/>
          <!-- hands on cheeks appear at high counts -->
          <g id="hands" opacity="0">
            <ellipse cx="28" cy="140" rx="16" ry="24" fill="#FFD2A8" stroke="#2B0B3F" stroke-width="4"/>
            <ellipse cx="172" cy="140" rx="16" ry="24" fill="#FFD2A8" stroke="#2B0B3F" stroke-width="4"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="count" id="count">…</div>
    <p class="count-label" id="countLabel">oh my goshes</p>
    <button class="link undo" id="undo" type="button">undo last press</button>
    <p class="status" id="status"></p>
  </main>

  <section class="stats panel" aria-label="Level">
    <div class="rank" id="rank">Totally unbothered</div>
    <p class="next" id="next"></p>
    <button class="small" id="sound" aria-pressed="true">Sound: on</button>
  </section>

  <section class="history panel" aria-labelledby="historyTitle">
    <h2 id="historyTitle">History</h2>
    <p class="last" id="last"></p>
    <ol class="log" id="log"></ol>
    <p class="more" id="more" hidden></p>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog">
    <p id="dlgText"></p>
    <label id="dlgNameRow">Name <input id="dlgName" type="text" maxlength="24" placeholder="Someone"></label>
    <div class="dlg-btns">
      <button class="small" id="dlgOk" value="ok">Save</button>
      <button class="small" id="dlgCancel" value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<p class="sr-only" aria-live="polite" id="live"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, doc, collection, query, orderBy, limit, onSnapshot,
  writeBatch, runTransaction, updateDoc, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// Firebase web app config (public by design; firestore.rules protect the data)
const firebaseConfig = {
  apiKey: "AIzaSyDl9qbvwnSafhC5ICGV3aqyxR5eJIYkSqg",
  authDomain: "omg-counter-c8eb2.firebaseapp.com",
  projectId: "omg-counter-c8eb2",
  storageBucket: "omg-counter-c8eb2.firebasestorage.app",
  messagingSenderId: "672007046877",
  appId: "1:672007046877:web:491ceda64fd048724d7d34"
};

const SOUND_KEY = "omg-sound";
const NICK_KEY = "omg-nick";
const MAX_PER_WRITE = 10;      // must match firestore.rules
const FLUSH_MS = 4000;         // presses wait this long before sending, so "undo last press" can take them back
const HISTORY_SIZE = 50;

const PHRASES = ["oh my gosh", "OH MY GOSH", "oh. my. gosh.", "ohhh myyy goshhh", "OMG", "oh my GOODNESS",
  "gasp!", "no way", "oh my gosh?!", "stop it right now", "I can't even", "my stars",
  "good gracious", "OH. MY. GOSH.", "gosh gosh gosh", "clutches pearls"];
const RANKS = [[0, "Totally unbothered"], [1, "Mildly surprised"], [10, "Raised one eyebrow"],
  [25, "Clutching pearls"], [50, "Needs to sit down"], [100, "Fanning self dramatically"],
  [200, "Has fainted onto a couch"], [500, "Soap opera protagonist"],
  [1000, "Gasped so hard it echoed"], [2500, "Legally a gasp"],
  [5000, "Oh my gosh has become everyone's personality"]];

const $ = id => document.getElementById(id);
const btn = $("gasp"), undoBtn = $("undo"), statusEl = $("status"), bubble = $("bubble"),
      countEl = $("count"), labelEl = $("countLabel"), rankEl = $("rank"), nextEl = $("next"),
      lastEl = $("last"), logEl = $("log"), moreEl = $("more"),
      mouth = $("mouth"), hands = $("hands"), live = $("live"), soundBtn = $("sound"), nickInput = $("nick"),
      dlg = $("dlg"), dlgText = $("dlgText"), dlgNameRow = $("dlgNameRow"), dlgName = $("dlgName"),
      dlgOk = $("dlgOk"), dlgCancel = $("dlgCancel");

const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const fmt = n => n.toLocaleString("en-US");
const cleanName = s => s.replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0, 24) || "Someone";

let soundOn = load(SOUND_KEY, "1") === "1";
let audioCtx = null;
nickInput.value = load(NICK_KEY, "");
nickInput.addEventListener("input", () => save(NICK_KEY, nickInput.value));

// ---- state ----
let loaded = false, serverCount = 0, prevServerCount = null;
let queued = 0, inFlight = 0, timer = null;
let history = [], historyLoaded = false;   // newest first: { id, by, n, at: Date|null, pending }
const shown = () => serverCount + queued;

function rankFor(n) {
  let current = RANKS[0], next = null;
  for (let i = 0; i < RANKS.length; i++) {
    if (n >= RANKS[i][0]) { current = RANKS[i]; next = RANKS[i + 1] || null; }
  }
  return { current, next };
}

function setStatus(t) { statusEl.textContent = t; }

// ---- rendering ----
function whenText(date) {
  const now = new Date();
  const secs = Math.max(0, Math.round((now - date) / 1000));
  let rel;
  if (secs < 5) rel = "just now";
  else if (secs < 60) rel = `${secs} s ago`;
  else if (secs < 3600) rel = `${Math.floor(secs / 60)} min ago`;
  else if (secs < 86400) rel = `${Math.floor(secs / 3600)} h ago`;
  else rel = `${Math.floor(secs / 86400)} d ago`;
  const time = date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const sameDay = date.toDateString() === now.toDateString();
  const day = sameDay ? "today" : date.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  return `${day} at ${time} (${rel})`;
}

function shortTime(date) {
  if (!date) return "sending…";
  const time = date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  if (date.toDateString() === new Date().toDateString()) return time;
  return `${date.toLocaleDateString(undefined, { day: "numeric", month: "short" })}, ${time}`;
}

function renderLast() {
  lastEl.textContent = "";
  if (!historyLoaded) return;
  const h = history[0];
  if (!h) { lastEl.textContent = "No presses recorded yet."; return; }
  const b = document.createElement("strong");
  b.textContent = h.by;   // textContent only: names are untrusted input
  lastEl.append("Last oh my gosh: ", b, h.at ? `, ${whenText(h.at)}` : "");
}
setInterval(renderLast, 1000);

function linkButton(text, label, onClick, disabled) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "link"; b.textContent = text;
  b.setAttribute("aria-label", label);
  b.disabled = disabled;
  b.addEventListener("click", onClick);
  return b;
}

function renderHistory() {
  logEl.replaceChildren(...history.map(h => {
    const li = document.createElement("li");
    const info = document.createElement("div");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = h.n > 1 ? `${h.by} ×${h.n}` : h.by;
    const t = document.createElement("time");
    t.textContent = shortTime(h.at);
    if (h.at) t.dateTime = h.at.toISOString();
    info.append(name, t);
    const what = `${h.by}'s press at ${shortTime(h.at)}`;
    li.append(info,
      linkButton("edit", `Rename ${what}`, () => openDialog("edit", h), h.pending),
      linkButton("delete", `Delete ${what}`, () => openDialog("delete", h), h.pending));
    return li;
  }));
  moreEl.hidden = history.length < HISTORY_SIZE;
  moreEl.textContent = `Showing the latest ${HISTORY_SIZE}.`;
  renderLast();
}

function render() {
  soundBtn.textContent = "Sound: " + (soundOn ? "on" : "off");
  soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  undoBtn.classList.toggle("show", queued > 0);
  if (!loaded) return;
  const n = shown();
  countEl.textContent = fmt(n);
  labelEl.textContent = n === 1 ? "oh my gosh" : "oh my goshes";
  const { current, next } = rankFor(n);
  rankEl.textContent = current[1];
  nextEl.textContent = next ? `${fmt(next[0] - n)} more until: ${next[1]}` : "There is nothing left to be shocked by.";
  const level = Math.min(n / 200, 1);
  mouth.setAttribute("rx", (14 + level * 12).toFixed(1));
  mouth.setAttribute("ry", (16 + level * 14).toFixed(1));
  hands.setAttribute("opacity", n >= 25 ? "1" : "0");
}

// ---- effects ----
function tone(steps, type) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    steps.forEach(([f1, f2, d, len]) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t + d);
      if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + d + len * 0.55);
      gain.gain.setValueAtTime(0.0001, t + d);
      gain.gain.exponentialRampToValueAtTime(0.25, t + d + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + d + len);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t + d); osc.stop(t + d + len + 0.01);
    });
  } catch (e) {}
}
const gaspSound = () => { const b = 280 + Math.random() * 160; tone([[b, b * 2.4, 0, 0.35]], "triangle"); };

function floater(text, source, extraClass) {
  const el = document.createElement("div");
  el.className = "floater" + (extraClass ? " " + extraClass : "");
  el.textContent = text;
  if (source) {
    const r = source.getBoundingClientRect();
    el.style.left = (r.left + r.width / 2 + (Math.random() - .5) * r.width * .6) + "px";
    el.style.top = (r.top + r.height * .3) + "px";
    el.style.fontSize = (1.1 + Math.random() * 1.3) + "rem";
  } else {
    el.style.left = (10 + Math.random() * 80) + "vw";
    el.style.top = (55 + Math.random() * 35) + "vh";
  }
  el.style.setProperty("--r", ((Math.random() - .5) * 30).toFixed(0) + "deg");
  el.style.setProperty("--dx", ((Math.random() - .5) * 140).toFixed(0) + "px");
  document.body.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
  setTimeout(() => el.remove(), 2500);
}
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ---- Firebase ----
let db = null, counterRef = null, pressesRef = null;

function scheduleFlush() {
  clearTimeout(timer); timer = null;
  // over the per-write cap: send a full batch now but keep the newest press queued, so it stays undoable
  if (queued > MAX_PER_WRITE) { flush(); return; }
  timer = setTimeout(() => { timer = null; flush(); }, FLUSH_MS);
}

function flush() {
  if (!db || queued === 0) return;
  const n = Math.min(queued, MAX_PER_WRITE);
  queued -= n;
  inFlight++;
  // One batch: raise the total and add a history entry. The local cache applies it immediately.
  const batch = writeBatch(db);
  batch.set(counterRef, { count: increment(n) }, { merge: true });
  batch.set(doc(pressesRef), { by: cleanName(nickInput.value), at: serverTimestamp(), n });
  batch.commit()
    .then(() => { if (statusEl.dataset.err) { setStatus(""); delete statusEl.dataset.err; } })
    .catch(err => {
      statusEl.dataset.err = "1";
      if (err.code === "resource-exhausted") setStatus("The page hit its daily limit. Presses will count again tomorrow.");
      else if (err.code === "permission-denied") setStatus("That press was rejected by the server.");
      else setStatus("Couldn't save that press. Check your connection.");
    })
    .finally(() => { inFlight--; });
  if (queued > 0) scheduleFlush();
}

function undo() {
  if (queued === 0) return;
  queued--;
  if (queued === 0) { clearTimeout(timer); timer = null; }
  live.textContent = "Last press undone";
  render();
}

function press() {
  if (!loaded) return;
  const before = rankFor(shown()).current;
  queued++;
  scheduleFlush();
  const phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  bubble.textContent = phrase; floater(phrase, btn); gaspSound(); restart(countEl, "bump");
  const after = rankFor(shown()).current;
  if (after !== before) {
    restart(document.body, "shake");
    live.textContent = `New level: ${after[1]}`;
  }
  render();
}

// ---- rename / delete a history entry (behind a confirm dialog) ----
let dlgMode = null, dlgTarget = null;

function openDialog(mode, h) {
  dlgMode = mode; dlgTarget = h;
  const what = h.n > 1 ? `${h.n} presses` : "press";
  if (mode === "delete") {
    dlgText.textContent = `Delete ${h.by}'s ${what} from ${shortTime(h.at)}? The total goes down by ${h.n}. This can't be undone.`;
    dlgOk.textContent = "Delete"; dlgOk.classList.add("danger");
  } else {
    dlgText.textContent = `Rename the ${what} from ${shortTime(h.at)}.`;
    dlgOk.textContent = "Save"; dlgOk.classList.remove("danger");
    dlgName.value = h.by;
  }
  dlgNameRow.hidden = mode !== "edit";
  dlg.returnValue = "";   // Esc keeps the previous returnValue, so clear it
  dlg.showModal();
  if (mode === "edit") dlgName.select(); else dlgCancel.focus();
}

dlg.addEventListener("close", () => {
  if (dlg.returnValue !== "ok" || !dlgTarget) return;
  const mode = dlgMode, ref = doc(pressesRef, dlgTarget.id);
  dlgTarget = null;
  const job = mode === "delete"
    ? runTransaction(db, async tx => {
        // read inside the transaction so the total drops by the entry's real size, and only once
        const snap = await tx.get(ref);
        if (!snap.exists()) return;
        tx.delete(ref);
        tx.update(counterRef, { count: increment(-snap.data().n) });
      })
    : updateDoc(ref, { by: cleanName(dlgName.value) });
  job.then(() => { live.textContent = mode === "delete" ? "Press deleted" : "Press renamed"; })
     .catch(() => setStatus(mode === "delete" ? "Couldn't delete that press." : "Couldn't rename that press."));
});

function listen() {
  onSnapshot(counterRef, snap => {
    const d = snap.data() || {};
    const newCount = typeof d.count === "number" ? d.count : 0;
    // a server-confirmed rise we didn't cause = someone else pressed
    if (prevServerCount !== null && newCount > prevServerCount && !snap.metadata.hasPendingWrites && inFlight === 0) {
      restart(countEl, "bump");
    }
    prevServerCount = serverCount = newCount;
    if (!loaded) { loaded = true; btn.disabled = false; }
    render();
  }, () => setStatus("Can't reach the shared counter right now. Reload to try again."));

  onSnapshot(query(pressesRef, orderBy("at", "desc"), limit(HISTORY_SIZE)), snap => {
    if (historyLoaded) {
      for (const ch of snap.docChanges()) {
        const d = ch.doc.data();
        // someone else's fresh press (not ours, and not an old entry scrolling back into the list)
        if (ch.type === "added" && !ch.doc.metadata.hasPendingWrites && d.at && Date.now() - d.at.toMillis() < 120000) {
          for (let i = 0; i < Math.min(d.n, 3); i++) setTimeout(() => floater(`${d.by}: oh my gosh`, null, "other"), i * 180);
        }
      }
    }
    history = snap.docs.map(s => {
      const d = s.data({ serverTimestamps: "estimate" });
      return { id: s.id, by: d.by, n: d.n, at: d.at ? d.at.toDate() : null, pending: s.metadata.hasPendingWrites };
    });
    historyLoaded = true;
    renderHistory();
  }, () => setStatus("Can't load the history right now. Reload to try again."));
}

btn.disabled = true;
try {
  db = getFirestore(initializeApp(firebaseConfig));
  counterRef = doc(db, "counters", "omg");
  pressesRef = collection(counterRef, "presses");
  listen();
} catch (e) {
  setStatus("Couldn't start the shared counter. Check the Firebase config.");
}

// flush queued presses when the tab is hidden or closed
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { clearTimeout(timer); timer = null; flush(); }
});

btn.addEventListener("click", press);
undoBtn.addEventListener("click", undo);
btn.addEventListener("pointerdown", () => btn.classList.add("pressed"));
["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, () => btn.classList.remove("pressed")));
soundBtn.addEventListener("click", () => { soundOn = !soundOn; save(SOUND_KEY, soundOn ? "1" : "0"); render(); });

const pL = $("pupilL"), pR = $("pupilR");
window.addEventListener("pointermove", e => {
  const r = btn.getBoundingClientRect();
  const dx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / 300));
  const dy = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / 300));
  pL.setAttribute("cx", 70 + dx * 5); pL.setAttribute("cy", 88 + dy * 6);
  pR.setAttribute("cx", 130 + dx * 5); pR.setAttribute("cy", 88 + dy * 6);
});

render();
</script>
</body>
